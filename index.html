<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f5f7f4">
	<title>Neoprove | Hello, world!</title>
	<style>
		:root {
			color-scheme: light;
			font-family: Georgia, "Times New Roman", serif;
			color: #18251f;
			background: #f5f7f4;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			grid-template-rows: auto 1fr auto;
			padding: 32px clamp(24px, 6vw, 88px) 24px;
		}

		header,
		footer {
			font-family: "Segoe UI", sans-serif;
		}

		header {
			display: flex;
			align-items: center;
			gap: 10px;
			font-size: 14px;
			font-weight: 700;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		.mark {
			width: 12px;
			height: 12px;
			border-radius: 50%;
			background: #d45136;
		}

		main {
			align-self: center;
			width: min(100%, 760px);
			margin: 0 auto;
			padding: 72px 0;
			animation: arrive 650ms ease-out both;
		}

		.eyebrow {
			margin: 0 0 22px;
			color: #527264;
			font: 600 12px/1.4 "Segoe UI", sans-serif;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		h1 {
			max-width: 680px;
			margin: 0;
			font-size: clamp(52px, 9vw, 104px);
			font-weight: 400;
			line-height: 0.98;
		}

		h1 span {
			color: #d45136;
		}

		.intro {
			max-width: 440px;
			margin: 28px 0 0;
			color: #526159;
			font: 16px/1.7 "Segoe UI", sans-serif;
		}

		footer {
			display: flex;
			justify-content: space-between;
			gap: 16px;
			color: #718078;
			font-size: 12px;
		}

		@keyframes arrive {
			from { opacity: 0; transform: translateY(12px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after {
				animation-duration: 0.01ms !important;
				animation-iteration-count: 1 !important;
			}
		}
	</style>
</head>
<body>
	<header><span class="mark" aria-hidden="true"></span>Neoprove</header>
	<main>
		<p class="eyebrow">A new beginning</p>
		<h1>Hello,<br><span>world!</span></h1>
		<p class="intro">Welcome to Neoprove. This is the beginning of something good.</p>
	</main>
	<footer>
		<span>Neoprove</span>
		<span>Made for what comes next.</span>
	</footer>
</body>
</html>
